# ============================================================
# 采集配置
# ============================================================

collect:
  # 搜索关键词。先窄后宽：一开始只打你最关心的几个，
  # 看数据长什么样再决定要不要铺开——省得拉一堆噪音回来再洗。
  keywords:
    - Agent
    - RAG
    - 大模型
    - LLM

  # 每页条数（飞书接口的 limit）
  page_size: 50

  # ⚠️ 两次请求之间的最小间隔（秒）。这是本项目最重要的自我约束。
  #    实测：字节单关键词 count=2111，按 50 一页就是 43 次请求。
  #    3 秒 → 约 2 分钟拉完一个关键词。慢，但这是礼貌的代价。
  min_interval_seconds: 3.0

  timeout_seconds: 30
  max_retries: 3

paths:
  data_dir: data
  raw_archive_dir: data/raw      # 原始响应归档（可回放）
  postings_file: data/postings.jsonl   # 归一化后的岗位
